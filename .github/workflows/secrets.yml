name: Secret scanning (repo-level)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 0" # weekly

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
