name: Secret scanning (repo-level)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 0" # weekly

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action v3 reads the pull request's commits through the API
      # rather than the local clone, so it needs this on pull_request runs.
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required since v3: without it the action fails outright on
          # pull_request events instead of scanning them.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
