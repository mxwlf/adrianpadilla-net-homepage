# ---------------------------------------------------------------------------
# Release — build the package once, attest it, attach it to the Release
# ---------------------------------------------------------------------------
# This is the ONLY place a release artifact is built. The test environment and
# production both deploy the asset produced here, so a promotion is a promotion
# and not a second, unverified build.
#
# Triggered by release-please publishing a Release. It checks out the tag rather
# than a branch, so the package is built from exactly the commit that was
# tagged, even if `develop` has already moved on.
#
# `make package` re-runs the gates in report-producing mode (build,
# html-validate, Playwright, axe, Lighthouse) and collects their output into the
# package, so the evidence travels with the artifact it describes.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach assets to the Release
      id-token: write # mint the OIDC token attest-build-provenance signs with
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Via env rather than inline interpolation: a tag name is attacker-
      # controlled in the general case, and must not be pasted into a shell.
      - name: Resolve the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build the release package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: make package

      - name: Archive the package
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          archive="release-${VERSION}.tar.gz"
          tar -czf "$archive" -C release .
          echo "name=${archive}" >> "$GITHUB_OUTPUT"
          echo "### Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```json'
            cat release/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Binds the archive's digest to this workflow, this commit and this
      # runner. `gh attestation verify --owner mxwlf <archive>` checks it, and
      # the promote job verifies the digest before production is touched.
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.name }}

      # manifest.json and SHA256SUMS go up alongside the archive so the deploy
      # jobs can read the version and the expected digests without downloading
      # and unpacking the whole package first.
      - name: Attach the assets to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          gh release upload "$TAG" \
            "$ARCHIVE" \
            release/SHA256SUMS \
            release/manifest.json \
            --clobber

  # ---------------------------------------------------------------------------
  # The test environment is torn down between releases, so it has to be put
  # back before anything can be deployed to it.
  # ---------------------------------------------------------------------------
  # `make test-env-restore` is idempotent: when the app is already up and
  # test.adrianpadilla.net already resolves to it, this is one no-op apply and
  # one DNS read. When it is not, it rebuilds the Static Web App and repoints
  # the CNAME at the new *.azurestaticapps.net hostname Azure assigns it -- a
  # rebuilt app never gets its old hostname back, which is the whole reason that
  # record is no longer hand-made. See scripts/test-env.sh.
  #
  # Its own job rather than steps inside `deploy-test`, so that "the environment
  # exists" and "the release is on it" fail separately and can be re-run
  # separately.
  ensure-test:
    needs: package
    runs-on: ubuntu-24.04
    # No `url:` -- this job makes the environment exist, it does not publish
    # anything to it, so it should not claim the deployment.
    environment:
      name: test
    permissions:
      contents: read
      id-token: write # workload identity federation to Azure
    # Shared with test-env.yml. A dispatched teardown landing between this
    # restore's two applies would leave DNS aimed at an app that no longer
    # exists, so the two workflows queue behind each other.
    concurrency:
      group: test-env
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
          # The wrapper rewrites stdout, which breaks the `tofu output -raw`
          # calls the script reads the app's hostname from.
          tofu_wrapper: false

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.TEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.TEST_SUBSCRIPTION_ID }}

      # backend.config and terraform.tfvars are git-ignored (they name the state
      # storage account and the subscription), so they are written here rather
      # than checked out. The values match what `make tf-bootstrap` writes.
      - name: Write the OpenTofu backend configuration and variables
        env:
          RESOURCE_GROUP: ${{ vars.TEST_RESOURCE_GROUP }}
          STORAGE_ACCOUNT: ${{ vars.TEST_TFSTATE_STORAGE_ACCOUNT }}
          SUBSCRIPTION_ID: ${{ vars.TEST_SUBSCRIPTION_ID }}
        run: |
          # Named explicitly, because an unset repository variable interpolates
          # to the empty string and `tofu init` would then fail on a backend
          # pointing at account "" — an error that says nothing about the cause.
          for v in RESOURCE_GROUP STORAGE_ACCOUNT SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::repository variable for $v is not set — see docs/deployment.md, Repository variables"
              exit 1
            fi
          done
          cat > infra/test/backend.config <<EOF
          resource_group_name  = "${RESOURCE_GROUP}"
          storage_account_name = "${STORAGE_ACCOUNT}"
          container_name       = "tfstate"
          key                  = "test.tfstate"
          subscription_id      = "${SUBSCRIPTION_ID}"
          EOF
          cat > infra/test/terraform.tfvars <<EOF
          subscription_id     = "${SUBSCRIPTION_ID}"
          resource_group_name = "${RESOURCE_GROUP}"
          EOF

      - name: Restore the test environment and its DNS
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ vars.TEST_AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.TEST_SUBSCRIPTION_ID }}
          DNS_SUBSCRIPTION_ID: ${{ vars.DNS_SUBSCRIPTION_ID }}
          DNS_RESOURCE_GROUP: ${{ vars.DNS_RESOURCE_GROUP }}
          DNS_ZONE: ${{ vars.DNS_ZONE }}
          DNS_RECORD_NAME: ${{ vars.TEST_DNS_RECORD_NAME }}
        run: make test-env-restore

  deploy-test:
    # Sequenced, not co-triggered. Both this and `package` used to fire on
    # `release: published` with nothing ordering them, so the deploy raced the
    # build whose asset it downloads -- and lost every time, because the first
    # thing it does is `gh release download` of a file that does not exist until
    # `package` finishes several minutes later.
    #
    # `ensure-test` is the second ordering constraint, and a newer one: the
    # environment is torn down between releases, so the app this deploys to may
    # not exist until that job has run.
    needs: [package, ensure-test]
    runs-on: ubuntu-24.04
    environment:
      name: test
      url: https://${{ vars.TEST_HOSTNAME }}
    permissions:
      contents: read
      id-token: write # workload identity federation to Azure
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the pinned @azure/static-web-apps-cli. Deliberately a project
      # dependency rather than `npx @latest`: Dependabot then tracks its version
      # and osv-scan sees it in package-lock.json, which an ad-hoc npx download
      # would bypass entirely.
      - run: npm ci

      - name: Download the release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p package
          gh release download "$TAG" \
            --pattern 'release-*.tar.gz' \
            --pattern 'SHA256SUMS' \
            --pattern 'manifest.json' \
            --dir .
          tar -xzf release-*.tar.gz -C package

      # Before anything is deployed: prove the archive is the one THIS repo's
      # Release workflow produced, then prove its contents match the digests
      # published inside it.
      #
      # The attestation check has to come first and cannot be skipped. SHA256SUMS
      # and manifest.json are themselves Release assets, so on their own they
      # prove only that three files agree with each other -- an identity able to
      # replace all three would pass. attest-build-provenance binds the archive
      # digest to this workflow, this commit and this runner, and signs it, which
      # is the only part of the chain an attacker cannot rewrite. It also covers
      # manifest.json, which SHA256SUMS deliberately cannot (it would have to
      # hash itself).
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive=$(ls release-*.tar.gz)
          gh attestation verify "$archive" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"

      - name: Verify the package digests
        working-directory: package
        run: |
          sha256sum -c SHA256SUMS
          echo "--- manifest ---"
          cat manifest.json

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.TEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.TEST_SUBSCRIPTION_ID }}

      # Needs Microsoft.Web/staticSites/listSecrets/action on the app. Fetching
      # it here means the token never exists outside this job.
      - name: Fetch the deployment token
        id: swa
        env:
          NAME: ${{ vars.TEST_STATIC_WEB_APP_NAME }}
          GROUP: ${{ vars.TEST_RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list \
            --name "$NAME" \
            --resource-group "$GROUP" \
            --query 'properties.apiKey' \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy the package
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ steps.swa.outputs.token }}
          CONFIG_DIR: package/host-config/test
        run: |
          # --env production targets the real slot. The CLI defaults to
          # "preview", which would create a staging environment -- the Free
          # plan allows three, and filling them previously broke every deploy
          # on this account.
          #
          # --swa-config-location is the equivalent of the action's
          # config_file_location: host configuration stays outside site/, so
          # the content digest is identical in every environment.
          #
          # Nothing is built here. The content is already compiled and its
          # digest was verified above.
          npm exec --silent -- swa deploy package/site \
            --swa-config-location "$CONFIG_DIR" \
            --env production

      - name: Smoke-test the deployed site
        env:
          HOSTNAME_UNDER_TEST: ${{ vars.TEST_HOSTNAME }}
          # How long the host configuration is allowed to take to reach the
          # edge. Generous on purpose: overshooting costs a slow job, while
          # undershooting fails a release that deployed correctly.
          CONFIG_WAIT_SECONDS: "180"
        run: |
          url="https://${HOSTNAME_UNDER_TEST}/"
          echo "GET $url"

          # POLLED ON THE ASSERTION, NOT RETRIED ON THE REQUEST, and the
          # difference is the whole reason this loop exists.
          #
          # `swa deploy` returns once the upload is accepted. The content and
          # staticwebapp.config.json then reach the edge independently, so a
          # request that lands in between gets HTTP 200, serving the new content
          # with none of the configured headers. `curl --retry-all-errors` does
          # not help with that: a 200 is not an error, so the retry budget is
          # never spent and the first response is the one asserted on.
          #
          # v1.3.3 failed exactly that way, two seconds after the deploy. The
          # response had `content-type` and `date` and nothing else -- no
          # cache-control, no etag, no CSP, no X-Robots-Tag. The same URL served
          # the full header set minutes later, so the site had been correct the
          # whole time and the check was wrong.
          #
          # A failed request leaves `headers` empty and takes the same path, so
          # this also covers a cold TLS handshake on a freshly bound hostname.
          deadline=$(( SECONDS + CONFIG_WAIT_SECONDS ))
          while :; do
            headers=$(curl -fsS -D - -o /dev/null "$url") || headers=''

            # The one header that must differ from production. Without it the
            # staging host is indexable, and it serves production's canonical
            # URLs, which is exactly the duplicate-content case to avoid.
            if printf '%s' "$headers" | grep -qi '^x-robots-tag:.*noindex'; then
              echo "$headers"
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "$headers"
              echo "::error::X-Robots-Tag: noindex still absent after ${CONFIG_WAIT_SECONDS}s — the test host-config was not applied"
              exit 1
            fi

            echo "host-config not live yet after ${SECONDS}s, waiting"
            sleep 10
          done

          # Canonical still points at production, because the bytes are
          # production's. Proves site/ was not rewritten per environment.
          curl -fsS "$url" | grep -q 'rel="canonical" href="https://adrianpadilla.net' || {
            echo "::error::canonical URL is not production's — site/ is not environment-neutral"
            exit 1
          }

      # Asserts the leak described at the top of this file has not returned.
      - name: Assert no staging environments were created
        env:
          NAME: ${{ vars.TEST_STATIC_WEB_APP_NAME }}
          GROUP: ${{ vars.TEST_RESOURCE_GROUP }}
        run: |
          extra=$(az staticwebapp environment list \
            --name "$NAME" \
            --resource-group "$GROUP" \
            --query "[?buildId!='default'].buildId" \
            --output tsv)
          if [ -n "$extra" ]; then
            echo "::error::unexpected Static Web Apps staging environments: $extra"
            echo 'Delete them with: az staticwebapp environment delete --name <app> --environment-name <id>'
            exit 1
          fi
          echo "no staging environments — production slot only"
