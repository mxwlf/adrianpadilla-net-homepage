name: Azure Static Web Apps CI/CD

# Production deploys only — no pull request preview environments.
#
# Previews were removed because Azure could create them but never tear them
# down. The close action authenticated (it printed a DeploymentId) and then the
# content server answered "No matching static site found", on this app, every
# time. The deployment token is valid, since the same secret deploys below;
# repositoryUrl, provider and branch all match the repo; and passing the
# repo_token the action's container expects changed nothing. The environments
# for merged PRs 7, 13, 14, 29 and 30 all had to be deleted by hand.
#
# With a Free plan's 3 staging slots, that leak filled the quota and then
# failed every deploy with "This Static Web App already has the maximum number
# of staging environments" — so a broken preview teardown was taking production
# deploys down with it. Creating nothing is what makes that impossible.
#
# If previews are ever wanted back, the teardown cannot rely on this action:
# delete environments with `az staticwebapp environment delete` from a
# scheduled job authenticated by OIDC.
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_SKY_0F46C841E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
