name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # Every pull_request run asks Azure for a staging environment, and the plan
    # allows a fixed few (3 on Free, 10 on Standard). Dependabot opens them in
    # batches — 16 at once was enough to exhaust the quota and fail the job with
    # "This Static Web App already has the maximum number of staging
    # environments", which also takes down the deploy for human PRs.
    #
    # So bot pull requests get no preview. The test is on the PR's author, not
    # github.actor, so it holds for every synchronize regardless of who pushed,
    # and a human taking over a Dependabot branch does get a preview.
    #
    # Note the actor test is deliberately inside the pull_request branch only.
    # Hoisting it to cover the whole condition would also skip the PRODUCTION
    # deploy whenever a Dependabot PR is merged by automation, since the push
    # event's actor is then the bot.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_SKY_0F46C841E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    # Mirrors the author test above: a bot PR never got an environment, so
    # there is nothing to tear down and no point asking Azure to close one.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
      # So GITHUB_TOKEN below can actually read the pull request.
      pull-requests: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # The close action authenticates too; omitting the token made every
          # PR-close run fail with "ApiToken is invalid".
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_SKY_0F46C841E }}
          # With only the Azure token, close authenticated (it printed a
          # DeploymentId) and then Azure answered "No matching static site
          # found", leaving the environment behind on every merge. The action's
          # container exposes an INPUT_REPO_TOKEN that nothing was setting, so
          # the likely gap is that it cannot map the pull request to its
          # environment without GitHub API access. Unconfirmed: the only way to
          # exercise this path is to close a real pull request.
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
