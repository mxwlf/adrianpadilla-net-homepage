name: Production monitoring
on:
  schedule:
    - cron: "0 6 * * 1" # weekly on Monday at 06:00 UTC

permissions:
  contents: read

# No `|| 'https://example.com'` fallback. There was one, PROD_URL was never set,
# and so this job spent its life auditing example.com: the Lighthouse budgets
# failed for reasons that had nothing to do with this site, and the header check
# reported other people's headers as a pass. A monitor that silently watches the
# wrong host is worse than one that is obviously broken, so an unset variable
# now fails the run.
env:
  PROD_URL: ${{ vars.PROD_URL }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Require PROD_URL
        run: |
          test -n "$PROD_URL" || {
            echo "::error::vars.PROD_URL is not set — set it with: gh variable set PROD_URL --body https://adrianpadilla.net"
            exit 1
          }
          echo "monitoring $PROD_URL"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run Lighthouse CI against production
        run: |
          npx @lhci/cli autorun \
            --collect.url="$PROD_URL" \
            --collect.numberOfRuns=3

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-prod
          path: .lighthouseci

  security-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Check security headers
        run: |
          test -n "$PROD_URL" || {
            echo "::error::vars.PROD_URL is not set"
            exit 1
          }
          echo "Checking security headers for $PROD_URL"
          HEADERS=$(curl -sI "$PROD_URL")
          echo "$HEADERS"

          FAILED=0

          check_header() {
            if echo "$HEADERS" | grep -qi "$1"; then
              echo "[PASS] $1"
            else
              echo "[FAIL] $1 not found"
              FAILED=1
            fi
          }

          check_header "X-Content-Type-Options"
          check_header "X-Frame-Options"
          check_header "Referrer-Policy"
          check_header "Content-Security-Policy"

          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::Some security headers are missing"
          fi
