name: Lighthouse CI
# Pull requests only. This job used to run on pushes to `main` and `develop`
# too, which meant the budgets were measured four times on one release's bytes
# — on the release pull request, on the merge onto `develop`, while packaging
# (`report:lighthouse`), and again on `main` after production was already
# serving them. Nothing downstream of the pull request gates on the result.
#
# Lighthouse is also the one check here whose answer genuinely varies between
# runs: it is a measurement taken on a shared runner. Re-running it on an
# identical tree does not confirm the earlier verdict, it just rolls again.
#
# The job id is the `lighthouse` context that both rulesets require. Do not
# rename it without updating .github/rulesets/*.json.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: make build

      - name: Run Lighthouse CI (lab budgets)
        run: npm run lighthouse

      # See the note on the same step in monitor.yml. `.lighthouseci` is a
      # dot-directory and upload-artifact excludes hidden paths by default, so
      # this step has been uploading nothing on every pull request. The audit
      # that gates the `lighthouse` required check left no report behind to
      # read when it failed.
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouseci
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
