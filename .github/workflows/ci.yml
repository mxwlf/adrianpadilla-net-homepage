# ---------------------------------------------------------------------------
# GitHub Actions CI — THIN WRAPPER
# ---------------------------------------------------------------------------
# This workflow deliberately contains no build logic. It only:
#   1. checks out the code,
#   2. provides the two toolchains `make ci` needs (Node for the site, Python
#      for the pre-commit hooks),
#   3. runs `make ci`.
#
# All actual checks live in the Makefile (`make ci`) and in package.json, and
# run identically on a developer laptop. To change WHAT runs in CI, edit the
# Makefile, package.json and .pre-commit-config.yaml — not this file. The only
# things that belong here are platform-specific concerns that cannot live in a
# portable script: triggers, the runner image, and prerequisite installation.
name: CI

on:
  # The pull_request trigger is the gate. It fires for a PR from ANY head
  # branch, and it tests the merge ref — so with
  # `strict_required_status_checks_policy` forcing the head up to date, the tree
  # it checks is the tree the merge will produce.
  #
  # `develop` stays on the push trigger as the net behind that. Admins are
  # bypass actors on both rulesets with bypass_mode "pull_request", which means
  # a pull request can be merged with this check red or with a stale head, and
  # on a single-maintainer repository that is a real path rather than a
  # hypothetical one. This run is the only thing that would notice.
  #
  # `main` was here too, and is deliberately gone. The only writer to `main` is
  # promote-prod.yml's `record` job, merging a tag whose tree has already passed
  # this gate twice — once on the release pull request, once on the merge of it
  # onto `develop` — and which is, by then, already live in production. A third
  # identical run could not change anything: the deploy has happened, nothing
  # gates on the result, and the tree is the same bytes. See
  # docs/pipeline-map.md for the full count.
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id is the name GitHub reports this check under, so it is also the
  # `context` that .github/rulesets/main-protection.json requires. Renaming it
  # silently breaks branch protection: the required check is never reported, and
  # pull requests wait on it forever. Change both together.
  ci:
    # Pinned rather than `ubuntu-latest`: that label is remapped to a new Ubuntu
    # release periodically, which would change the build environment underneath
    # you on GitHub's schedule instead of yours. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Interpreter used to build .venv, which holds the pinned `pre-commit`
      # that `make ci`'s `hooks` target runs. Any version >= 3.10 works (see
      # MIN_PYTHON in the Makefile); it is pinned here only for reproducible
      # runs, not because the hooks need this exact version.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      # Third toolchain: `make ci` runs `tf-fmt-check` over infra/, so the
      # gate needs the tofu binary. This is prerequisite installation, which is
      # one of the few things that belongs in this file — the check itself lives
      # in the Makefile. Only formatting is checked here; `tofu validate` needs
      # to download providers and so runs in infra.yml instead.
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false

      # Cache pre-commit hook environments keyed on the config so unchanged
      # hooks are not rebuilt on every run.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install
        run: npm ci

      # Prerequisite installation, like `npm ci` above: `npm ci` fetches the
      # Playwright package but not the browser binaries its e2e tests drive,
      # and those live outside node_modules. Without this `make ci` fails in
      # CI while passing on any laptop that has them cached. Only chromium is
      # configured (see playwright.config.ts), so only chromium is fetched.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The single entrypoint. Everything CI does is defined in the Makefile.
      - name: Hooks + lint + build + test
        run: make ci

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
