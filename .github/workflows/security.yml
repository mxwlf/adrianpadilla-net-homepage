name: Security
# `develop` is the default branch, so it is where code scanning results belong.
# `main` is not listed: it only ever receives a merge of a tag whose tree has
# already been scanned here on the release pull request and again on the merge
# onto `develop`, so a third pass reports the same alerts against the same code.
on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    - cron: "17 4 * * 1" # weekly

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  codeql:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.3
      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.3

  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: OSV-Scanner
        # Two corrections over `google/osv-scanner-action@v2`: the action lives
        # in a subdirectory (the repo root holds a stub with no `runs:` section,
        # which the runner rejects), and no floating major tag is published, so
        # an exact release is required.
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          # --no-resolve turns off transitive resolution of MANIFESTS. It does
          # not touch lockfiles, so package-lock.json is still scanned in full.
          #
          # It is here because resolving requirements-dev.txt described an
          # environment this repo cannot have. virtualenv requires
          # `filelock<=3.19.1,>=3.19.1` on python_version < 3.10 and
          # `filelock>=3.24.2` at or above it; the resolver took the former
          # branch, reported 17 advisories against filelock 3.19.1 and
          # virtualenv 21.9.1, and the Makefile's check-python target refuses
          # to build .venv with anything below 3.10. A real .venv holds
          # filelock 4.2.4 and virtualenv 21.15.0, both patched.
          scan-args: |-
            --recursive
            --no-resolve
            .
