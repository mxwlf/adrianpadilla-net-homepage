name: Link Check
on:
  pull_request:
  schedule:
    - cron: "13 2 * * 2" # weekly

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # 429 is accepted deliberately: a rate-limited host means the link
          # resolved and the server throttled us, which is not a broken link.
          # Treating it as one made this job fail on whichever popular URL
          # happened to throttle that run. Real 4xx/5xx still fail the job.
          # Concurrency is lowered and retries added to provoke 429s less.
          args: >-
            --verbose --no-progress
            --accept 200..=299,429
            --max-concurrency 4
            --max-retries 3
            .
