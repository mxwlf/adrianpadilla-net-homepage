# ---------------------------------------------------------------------------
# Infrastructure validation — OpenTofu, no credentials
# ---------------------------------------------------------------------------
# `make tf-validate` downloads the azurerm provider, which is a few hundred
# megabytes. That is why it is not part of `make ci`: paying it on every laptop
# before every push would make the gate too expensive to actually run. It gets
# its own job instead, with the plugin directory cached.
#
# This job needs NO Azure credentials. `tofu init -backend=false` skips the
# backend entirely, and `validate` only type-checks the configuration. Nothing
# here can read or change either environment — `tf-plan` and `tf-apply` are
# run deliberately, by a person, and are not part of any gate.
#
# `make tf-validate` loops over every infra/*/ directory, so adding an
# environment needs no change here.
#
# `tf-fmt-check` is in `make ci` rather than here: it parses the HCL without
# needing a provider, so malformed configuration is caught by the main gate.

name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - "Makefile"
  # `main` is omitted for the reason security.yml gives: it receives only a
  # merge of an already-validated tag.
  push:
    branches: [develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          # There is no v1.13.5 OpenTofu *release* — the published tags jump
          # from v1.13.2 to v1.13.8, and setup-opentofu resolves against
          # releases, so asking for 1.13.5 fails with "No matching version
          # found". Homebrew happens to label its build 1.13.5, which is how the
          # wrong number got here.
          tofu_version: 1.13.8
          # The wrapper rewrites stdout to collect it for later steps, which
          # mangles `tofu fmt -diff` output. Nothing here needs it.
          tofu_wrapper: false

      - name: Cache the provider plugins
        uses: actions/cache@v6.1.0
        with:
          # Globbed over environments rather than naming one, so a new
          # infra/<env>/ is cached without editing this file. Both environments
          # pin the same provider version, so they share a key.
          path: infra/*/.terraform
          key: tofu-${{ runner.os }}-${{ hashFiles('infra/*/.terraform.lock.hcl') }}
          restore-keys: tofu-${{ runner.os }}-

      - run: make tf-validate
