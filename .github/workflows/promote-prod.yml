# ---------------------------------------------------------------------------
# Promote to production — the same package the test environment ran
# ---------------------------------------------------------------------------
# Dispatched by hand with a version. The `production` environment carries a
# required reviewer, so the run pauses until a human approves it and GitHub
# records the outcome as a Deployment.
#
# Any published version can be promoted, which is what makes rollback a
# promotion of an earlier version rather than a revert commit and a rebuild.
#
# NOTHING IS BUILT HERE. The archive is downloaded, its digests verified, and
# site/ uploaded. The only difference from the test deploy is
# config_file_location, because host configuration is infrastructure and content
# is the artifact.

name: Promote to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, without a leading v (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://adrianpadilla.net
    permissions:
      contents: read
      id-token: write # workload identity federation to Azure
    outputs:
      site-digest: ${{ steps.verify.outputs.site-digest }}
    steps:
      - name: Download the release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p package
          gh release download "v${VERSION}" \
            --pattern 'release-*.tar.gz' \
            --pattern 'SHA256SUMS' \
            --pattern 'manifest.json' \
            --dir .
          tar -xzf "release-${VERSION}.tar.gz" -C package

      # The gate before production. Verifies the payload against the digests
      # published with it, and that the manifest describes the version asked
      # for -- a mismatch means the assets were replaced after the build.
      - name: Verify the package
        id: verify
        working-directory: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum -c SHA256SUMS

          manifest_version=$(jq -r .version manifest.json)
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::manifest says version '$manifest_version', asked to promote '$VERSION'"
            exit 1
          fi

          digest=$(jq -r .siteSha256 manifest.json)
          echo "site-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "promoting ${VERSION}, site digest ${digest}"
          cat manifest.json >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PROD_SUBSCRIPTION_ID }}

      - name: Fetch the deployment token
        id: swa
        env:
          NAME: ${{ vars.PROD_STATIC_WEB_APP_NAME }}
          GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list \
            --name "$NAME" \
            --resource-group "$GROUP" \
            --query 'properties.apiKey' \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # production_branch is set explicitly. The action treats a deploy as a
      # PREVIEW when it believes the current branch is not the production one,
      # and this workflow runs on whatever ref it was dispatched from -- so
      # leaving it unset is how a promotion could silently land in a staging
      # slot instead of production. The Free plan has three such slots, and
      # filling them previously broke every deploy on this app.
      - name: Deploy the package
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          skip_app_build: true
          skip_api_build: true
          app_location: package/site
          api_location: ""
          output_location: ""
          config_file_location: package/host-config/prod
          production_branch: ${{ github.ref_name }}

      - name: Smoke-test production
        run: |
          echo "GET https://adrianpadilla.net/"
          headers=$(curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -D - -o /dev/null https://adrianpadilla.net/)
          echo "$headers"

          # The inverse of the test environment's assertion: production must be
          # indexable. If noindex is here, the wrong host-config shipped, and
          # the live site would quietly fall out of search results.
          if echo "$headers" | grep -qi '^x-robots-tag:.*noindex'; then
            echo "::error::production is serving X-Robots-Tag: noindex — the test host-config was deployed"
            exit 1
          fi

          echo "$headers" | grep -qi '^content-security-policy:' || {
            echo "::error::no Content-Security-Policy — host-config was not applied"
            exit 1
          }

      - name: Assert no staging environments were created
        env:
          NAME: ${{ vars.PROD_STATIC_WEB_APP_NAME }}
          GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
        run: |
          extra=$(az staticwebapp environment list \
            --name "$NAME" \
            --resource-group "$GROUP" \
            --query "[?buildId!='default'].buildId" \
            --output tsv)
          if [ -n "$extra" ]; then
            echo "::error::promotion created staging environments: $extra"
            echo 'The Free plan allows three. Delete with: az staticwebapp environment delete'
            exit 1
          fi
          echo "no staging environments — production slot only"

  # A separate job on purpose. By the time this runs production is already
  # updated, so a failure here means "main is stale", not "the deploy failed" --
  # and the two should not look alike in the run list.
  record:
    needs: promote
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Mint a short-lived app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # main is the record of what is live, so it moves only after a successful
      # promotion. The merge is created through the API, which means GitHub
      # signs it and main's required_signatures rule is satisfied.
      #
      # This needs the app listed in main-protection.json's bypass_actors with
      # bypass_mode "always": main otherwise accepts only reviewed pull
      # requests, and that is deliberate. See .github/rulesets/README.md.
      - name: Advance main to the promoted commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api --method POST "repos/${GH_REPO}/merges" \
            -f base=main \
            -f head="v${VERSION}" \
            -f commit_message="chore: record v${VERSION} in production" > /tmp/merge.json; then
            echo "main advanced to v${VERSION}"
          elif grep -q 'Already merged' /tmp/merge.json 2>/dev/null; then
            echo "main already contains v${VERSION} — nothing to record"
          else
            cat /tmp/merge.json
            echo "::error::could not advance main. If this is a 403, the app is not a bypass actor on main-protection."
            echo 'Add it, then run `make rulesets-export` to bring the change back into the repo.'
            exit 1
          fi
