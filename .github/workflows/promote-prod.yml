# ---------------------------------------------------------------------------
# Promote to production — the same package the test environment ran
# ---------------------------------------------------------------------------
# Dispatched by hand with a version. The `production` environment carries a
# required reviewer, so the run pauses until a human approves it and GitHub
# records the outcome as a Deployment.
#
# Any published version can be promoted, which is what makes rollback a
# promotion of an earlier version rather than a revert commit and a rebuild.
#
# NOTHING IS BUILT HERE. The archive is downloaded, its digests verified, and
# site/ uploaded. The only difference from the test deploy is
# config_file_location, because host configuration is infrastructure and content
# is the artifact.

name: Promote to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, without a leading v (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://adrianpadilla.net
    permissions:
      contents: read
      id-token: write # workload identity federation to Azure
    outputs:
      site-digest: ${{ steps.verify.outputs.site-digest }}
    steps:
      # Checked before anything slow happens, and before the approval is spent:
      # a leading "v" would otherwise produce `gh release download vv1.2.0` and
      # fail with "release not found" only after a human had already approved.
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the pinned @azure/static-web-apps-cli. Deliberately a project
      # dependency rather than `npx @latest`: Dependabot then tracks its version
      # and osv-scan sees it in package-lock.json, which an ad-hoc npx download
      # would bypass entirely.
      - run: npm ci

      - name: Validate the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v*)
              echo "::error::drop the leading v — pass 1.2.0, not $VERSION"
              exit 1
              ;;
          esac
          printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || {
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          }

      - name: Download the release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p package
          gh release download "v${VERSION}" \
            --pattern 'release-*.tar.gz' \
            --pattern 'SHA256SUMS' \
            --pattern 'manifest.json' \
            --dir .
          tar -xzf "release-${VERSION}.tar.gz" -C package

      # The real gate before production, and it has to be the attestation rather
      # than the digests: SHA256SUMS and manifest.json are Release assets too,
      # so an identity able to replace the archive could replace all three and
      # they would still agree with each other. Only the signed provenance ties
      # the archive back to this repository's Release workflow.
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh attestation verify "release-${VERSION}.tar.gz" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"

      - name: Verify the package
        id: verify
        working-directory: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum -c SHA256SUMS

          manifest_version=$(jq -r .version manifest.json)
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::manifest says version '$manifest_version', asked to promote '$VERSION'"
            exit 1
          fi

          # Constrained before it reaches $GITHUB_OUTPUT. `jq -r` emits raw
          # newlines, so an unconstrained value could write extra lines and
          # forge other job outputs.
          digest=$(jq -r .siteSha256 manifest.json)
          printf '%s' "$digest" | grep -qE '^[0-9a-f]{64}$' || {
            echo "::error::siteSha256 is not a sha256 digest"
            exit 1
          }

          echo "site-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "promoting ${VERSION}, site digest ${digest}"
          cat manifest.json >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.PROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PROD_SUBSCRIPTION_ID }}

      - name: Fetch the deployment token
        id: swa
        env:
          NAME: ${{ vars.PROD_STATIC_WEB_APP_NAME }}
          GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list \
            --name "$NAME" \
            --resource-group "$GROUP" \
            --query 'properties.apiKey' \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # There is no `production_branch` here, and that is worth stating because a
      # stray copy of it used to be. It was an input of the retired
      # Azure/static-web-apps-deploy action, which inferred "preview or
      # production" from whether it thought the current branch was the
      # production one. When this step became a plain `run:`, the line came with
      # it and bash tried to execute `production_branch:` as a command -- after
      # a completely successful deploy, so the site updated and the job still
      # failed with exit 127, which also skipped the `record` job that advances
      # `main`.
      #
      # The CLI needs no such inference: `--env production` names the slot
      # outright, independent of any branch. The staging-slot hazard that input
      # guarded against is also handled further upstream now --
      # `preview_environments_enabled = false` in infra/prod/main.tf means the
      # app cannot create one at all.
      - name: Deploy the package
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ steps.swa.outputs.token }}
          CONFIG_DIR: package/host-config/prod
        run: |
          # --env production targets the real slot. The CLI defaults to
          # "preview", which would create a staging environment -- the Free
          # plan allows three, and filling them previously broke every deploy
          # on this account.
          #
          # --swa-config-location is the equivalent of the action's
          # config_file_location: host configuration stays outside site/, so
          # the content digest is identical in every environment.
          #
          # Nothing is built here. The content is already compiled and its
          # digest was verified above.
          npm exec --silent -- swa deploy package/site \
            --swa-config-location "$CONFIG_DIR" \
            --env production

      - name: Smoke-test production
        env:
          CONFIG_WAIT_SECONDS: "180"
        run: |
          url=https://adrianpadilla.net/
          echo "GET $url"

          # Polled for the reason release.yml's test smoke test documents at
          # length: the content and staticwebapp.config.json reach the edge
          # independently, so a request right after a deploy can get HTTP 200
          # with none of the configured headers, and `--retry-all-errors` will
          # not retry a 200.
          #
          # THE STAKE IS HIGHER HERE. By the time this step runs, production has
          # already been updated. A false failure does not stop a bad deploy, it
          # reports a good one as broken and skips `record`, which leaves `main`
          # claiming an older version is live. That is the same end state as the
          # stray `production_branch` bug this file warns about above, reached a
          # different way.
          #
          # Waiting on the CSP first and asserting noindex second is deliberate.
          # Before any config is live there is nothing to judge: the noindex
          # check would pass vacuously on a response that has no headers at all,
          # so it would only ever be a real check once the CSP proves a config
          # arrived.
          deadline=$(( SECONDS + CONFIG_WAIT_SECONDS ))
          while :; do
            headers=$(curl -fsS -D - -o /dev/null "$url") || headers=''

            if printf '%s' "$headers" | grep -qi '^content-security-policy:'; then
              echo "$headers"
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "$headers"
              echo "::error::no Content-Security-Policy after ${CONFIG_WAIT_SECONDS}s — host-config was not applied"
              exit 1
            fi

            echo "host-config not live yet after ${SECONDS}s, waiting"
            sleep 10
          done

          # The inverse of the test environment's assertion: production must be
          # indexable. If noindex is here, the wrong host-config shipped, and
          # the live site would quietly fall out of search results.
          if printf '%s' "$headers" | grep -qi '^x-robots-tag:.*noindex'; then
            echo "::error::production is serving X-Robots-Tag: noindex — the test host-config was deployed"
            exit 1
          fi

      - name: Assert no staging environments were created
        env:
          NAME: ${{ vars.PROD_STATIC_WEB_APP_NAME }}
          GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
        run: |
          extra=$(az staticwebapp environment list \
            --name "$NAME" \
            --resource-group "$GROUP" \
            --query "[?buildId!='default'].buildId" \
            --output tsv)
          if [ -n "$extra" ]; then
            echo "::error::promotion created staging environments: $extra"
            echo 'The Free plan allows three. Delete with: az staticwebapp environment delete'
            exit 1
          fi
          echo "no staging environments — production slot only"

  # A separate job on purpose. By the time this runs production is already
  # updated, so a failure here means "main is stale", not "the deploy failed" --
  # and the two should not look alike in the run list.
  record:
    needs: promote
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Mint a short-lived app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # main is the record of what is live, so it moves only after a successful
      # promotion.
      #
      # This needs the app listed in main-protection.json's bypass_actors with
      # bypass_mode "always": main otherwise accepts only reviewed pull
      # requests, and that is deliberate. See .github/rulesets/README.md.
      #
      # Note what the bypass means for signatures, because it is easy to get
      # wrong: GitHub does sign the merge commit it creates here, but
      # required_signatures checks every commit a push introduces, and this
      # merge brings release-please's unsigned commits onto main as ancestors.
      # It succeeds because the bypass skips required_signatures along with the
      # rest of the ruleset -- not because everything it carries is signed. So
      # main is not "fully signed" once this job is installed; what stays true
      # is that no HUMAN can reach main except through a reviewed pull request
      # whose commits are signed. If you want the stronger property, drop this
      # job: the release tag and the Deployment record already state what is
      # live. docs/deployment.md covers that trade.
      - name: Advance main to the promoted commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          # Distinguished by status code, not by the body. A no-op merge returns
          # 204 with an EMPTY body, so matching on text like "Already merged"
          # can never fire -- and 204 is a success, so the happy-path branch
          # would have claimed main advanced when nothing happened. Promoting an
          # older version for a rollback takes that path every time, since its
          # tag is already an ancestor of main.
          code=$(gh api --method POST "repos/${GH_REPO}/merges" \
            -f base=main \
            -f head="v${VERSION}" \
            -f commit_message="chore: record v${VERSION} in production" \
            --include --silent 2>/dev/null |
            sed -n '1s#.* \([0-9][0-9][0-9]\).*#\1#p') || true

          case "$code" in
            201)
              echo "main advanced to v${VERSION}"
              ;;
            204)
              echo "main already contains v${VERSION} — nothing to record"
              ;;
            403)
              echo "::error::main refused the merge (403). The release App is not a bypass actor on main-protection."
              echo 'Add it with bypass_mode "always", then run `make rulesets-export`. See docs/deployment.md.'
              exit 1
              ;;
            *)
              echo "::error::could not advance main (HTTP ${code:-unknown})."
              exit 1
              ;;
          esac
